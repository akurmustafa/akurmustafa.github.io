        <h1>Maniler</h1>
        <p>
            A güzel, nere giden<br>
            Gel sana eşlik eden<br>
            Yalnız gitme bellolmaz<br>
            Hılı hırsızdır geçen<br>
        </p>
        <p>
            İşin başı yoruldum<br>
            Kenarıya duruldum<br>
            Anam ne durun dedi<br>
            Çalışmaya koyuldum<br>
        </p>
        <p>
            Sıra sıra dizili<br>
            Hepsi ekin biçeyi<br>
            Biraz geri kalsa da<br>
            Gönlümün birincisi<br>
        </p>
